<ion-grid>
    <ion-row class="ion-align-items-center" style="border-bottom: 2px solid #f4f4f4; margin-bottom: 20px;">
        <ion-col size="12" size-md="8">
            <h3 class="title-page" style="margin: 0; font-weight: 700; color: #2c3e50;">Configuracion de sistema</h3>
            <p style="color: #7f8c8d; margin: 4px 0 15px 0;">Configuracion de permisos</p>
        </ion-col>
    </ion-row>
    <ion-row>
        <ion-col>
            <mat-tab-group (selectedIndexChange)="onTabChange($event)">
                <mat-tab label="Permisos Tiendas">
                    <mt-permisos-tiendas *ngIf="tabIndex === 0"></mt-permisos-tiendas>
                </mat-tab>
                <mat-tab label="Sistema">
                    <mt-r-papeletas *ngIf="tabIndex === 1"></mt-r-papeletas>
                </mat-tab>
                <mat-tab label="Usuarios sistema">
                    <mt-usuarios-sistema *ngIf="tabIndex === 2"></mt-usuarios-sistema>
                </mat-tab>
                <mat-tab label="Registro Tiendas">
                    <mt-parametros-tienda *ngIf="tabIndex === 3"></mt-parametros-tienda>
                </mat-tab>
            </mat-tab-group>
        </ion-col>
    </ion-row>
</ion-grid>
