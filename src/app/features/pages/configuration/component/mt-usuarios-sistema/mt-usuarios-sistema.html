<ion-row>
    <ion-col class="col-12">
        <div style="display: flex; justify-content: end; padding-bottom: 12px; padding-top: 10px;">
            <button matTooltip="Guardar permisos" (click)="abrirFormularioUsuario()" id="searchProducto" type="button"
                class="btn btn-primary btn-sm" style="padding: 0 2px; margin-right: 3px; display: flex;
        justify-content: center; align-items: center; height: 34px; width: 164px;">
                <mat-icon style="margin-right: 5px;">person_add</mat-icon>
                <span>Nuevo Usuario</span>
            </button>
        </div>
    </ion-col>
    <ion-col class="col-12">
        <div class="container-fluid mb-3">
            <mat-form-field appearance="outline" class="w-100 bg-white rounded shadow-sm no-subscript">
                <mat-label>Buscar por nombre, email o nivel...</mat-label>
                <input matInput (keyup)="applyFilter($event)" #input>
                <mat-icon matSuffix>search</mat-icon>
            </mat-form-field>
        </div>

        <div class="container-fluid">
            <div class="table-responsive shadow-sm border rounded bg-white"
                style="max-height: calc(100vh - 250px); overflow: auto;">

                <table mat-table [dataSource]="dataSource" class="w-100">

                    <ng-container matColumnDef="usuario">
                        <th mat-header-cell *matHeaderCellDef> Usuario </th>
                        <td mat-cell *matCellDef="let user">
                            <div class="d-flex flex-column py-2">
                                <span class="fw-bold">{{user.USUARIO}}</span>
                                <small class="text-muted">{{user.EMAIL}}</small>
                            </div>
                        </td>
                    </ng-container>

                    <ng-container matColumnDef="nivel">
                        <th mat-header-cell *matHeaderCellDef> Nivel / Perfil </th>
                        <td mat-cell *matCellDef="let user">
                            <span class="badge" [ngClass]="getNivelClass(user.NIVEL)">
                                {{user.NIVEL}}
                            </span>
                        </td>
                    </ng-container>

                    <ng-container matColumnDef="accesos">
                        <th mat-header-cell *matHeaderCellDef class="text-center"> Configuración de Accesos </th>
                        <td mat-cell *matCellDef="let user" class="text-center">
                            <button mat-icon-button color="primary" matTooltip="Asignar Tiendas"
                                (click)="gestionarTiendas(user)">
                                <mat-icon>storefront</mat-icon>
                            </button>
                            <button mat-icon-button color="accent" matTooltip="Permisos de Menú"
                                (click)="gestionarPermisosMenu(user)">
                                <mat-icon>settings_suggest</mat-icon>
                            </button>
                        </td>
                    </ng-container>

                    <ng-container matColumnDef="acciones">
                        <th mat-header-cell *matHeaderCellDef class="text-end"> Acciones </th>
                        <td mat-cell *matCellDef="let user" class="text-end">
                            <button mat-icon-button (click)="editarUsuario(user)" color="default">
                                <mat-icon>edit</mat-icon>
                            </button>
                            <button mat-icon-button color="warn" (click)="eliminarUsuario(user.ID_LOGIN)">
                                <mat-icon>delete_outline</mat-icon>
                            </button>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="element-row"></tr>
                </table>

                <div *ngIf="dataSource.data.length === 0" class="p-4 text-center">
                    <mat-icon style="font-size: 48px; height: 48px; width: 48px; color: #ccc;">group_off</mat-icon>
                    <p class="text-muted mt-2">No se encontraron usuarios.</p>
                </div>
            </div>
        </div>
    </ion-col>
</ion-row>
