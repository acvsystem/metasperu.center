<ion-row><ion-col><div class="compact-input">
  <label [for]="id">{{ label }}</label>
  <input [id]="id" [attr.inputmode]="type === 'number' ? 'numeric' : null" type="text" [(ngModel)]="autoText"
    (keyup)="type === 'number' ? onChangeNumber($event) : onChange($event)" [placeholder]="placeholder" />
</div></ion-col></ion-row>
